# ==============================================================================
# PsyData Labs L.L.C. — Local Pre-Commit Config
# ==============================================================================
default_install_hook_types: [pre-commit, commit-msg, pre-push]
fail_fast: true

repos:
  # 1. File Hygiene & Private Key Blocking
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'production']

  # 2. Cryptographic Secret & Token Detection (Gitleaks)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # 3. Conventional Commits Enforcement
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, sec, perf, refactor, docs, test, build, ci, chore, gov]

